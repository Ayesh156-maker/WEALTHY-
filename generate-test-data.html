function random(array) {
    return array[Math.floor(Math.random() * array.length)];
}


function randomNumber(min, max) {
    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;
}


function createProduct(index) {

    const seller = random(sellers);

    const groupNames = Object.keys(categories);

    const group = random(groupNames);

    const categoryData = categories[group];

    const selectedCategory =
        random(categoryData.categories);

    const category =
        selectedCategory[0];

    const subcategory =
        selectedCategory[1];

    const brand =
        random(categoryData.brands);

    const color =
        random(colors);

    const material =
        random(materials);

    const finish =
        random(finishes);

    const price =
        randomNumber(500, 250000);

    const rating =
        Number((Math.random() * 2 + 3).toFixed(1));

    const reviewCount =
        randomNumber(0, 250);


    const name =
        `${brand} ${random(productNames)}`;


    return {

        name: name,

        brand: brand,

        categoryGroup: "Non-Digital",

        categoryType: categoryData.type,

        category: category,

        subcategory: subcategory,

        tags: [
            brand,
            category,
            subcategory,
            color,
            material,
            group,
            "luxury",
            "premium"
        ],

        price: price,

        rating: rating,

        reviewCount: reviewCount,

        material: material,

        length: randomNumber(20, 150),

        width: randomNumber(20, 150),

        height: randomNumber(20, 100),

        weight: Number(
            (Math.random() * 8 + 0.5).toFixed(2)
        ),

        color: color,

        finish: finish,

        frame: random(["Yes", "No"]),

        handmade: random(["Yes", "No"]),

        variantColors: [
            random(colors),
            random(colors)
        ],

        variantSizes: [
            "Small",
            "Medium",
            "Large"
        ],

        customizable:
            random(["Yes", "No"]),

        stock:
            randomNumber(1, 100),

        minOrder: 1,

        shipping:
            random(shippingOptions),

        country:
            random(countries),

        freeShipping:
            random(["Yes", "No"]),

        sellerName:
            seller.name,

        sellerStoreName:
            seller.store,

        sellerEmail:
            `seller${String(
                sellers.indexOf(seller) + 1
            ).padStart(2, "0")}@leangelo.test`,

        phone:
            `070${String(
                randomNumber(1000000, 9999999)
            )}`,

        sellerId:
            seller.id,

        sku:
            `LG-TEST-${String(index).padStart(5, "0")}`,

        description:
            `Premium ${subcategory} created for LeanGelo marketplace testing. This test product belongs to the ${group} category and is suitable for testing search, filters, ratings, recommendations and seller systems.`,

        status: "published",

        imageUploaded: true,

        imageUrl:
            `https://placehold.co/600x400?text=${encodeURIComponent(
                brand + " " + subcategory
            )}`,

        productStep: 3,

        earnings: 0,

        orders: 0,

        digitalColor: "",

        digitalFileName: "",

        digitalFileUrl: "",

        digitalHeight: 0,

        digitalWidth: 0,

        isTest: true,

        createdAt:
            new Date().toISOString(),

        publishedAt:
            new Date().toISOString()
    };
}


document
    .getElementById("generateBtn")
    .addEventListener("click", () => {

        const status =
            document.getElementById("status");

        status.textContent =
            "Generating 5,000 products...\nPlease wait.";

        const products = [];

        for (let i = 1; i <= 5000; i++) {

            products.push(
                createProduct(i)
            );
        }


        const data = {

            generatedAt:
                new Date().toISOString(),

            sellerCount:
                sellers.length,

            productCount:
                products.length,

            sellers: sellers,

            products: products

        };


        const blob =
            new Blob(
                [JSON.stringify(data, null, 2)],
                {
                    type: "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "test-products.json";

        a.click();


        URL.revokeObjectURL(url);


        status.textContent =
            "✅ Done!\n\n" +
            "30 test sellers generated.\n" +
            "5,000 test products generated.\n\n" +
            "Downloaded: test-products.json\n\n" +
            "Next: Put test-products.json in your project folder.";
    });
