<!DOCTYPE html>
<html>
<head>index.html
  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Seller Dashboard</title>
  <script type="module" src="dashboard.js"></script>
</head>

<body>

<div class="layout">

  <div class="sidebar">
    <div>
      <div class="brand">
        <a href="index.html"><img src="https://res.cloudinary.com/dxpizcvi5/image/upload/v1778826589/ChatGPT_Image_Apr_28_2026_05_39_55_PM_eucvov.png"></a>
        <div>
          <h2>LeanGelo</h2>
          <p>Seller Panel</p>
        </div>
      </div>

      <div class="menu">
        <div class="store-info">
    <h2 id="dashboardStoreName" ></h2>
  </div>
        <a class="active" href="dashboard.html">🏠 Dashboard</a>
<a href="products.html">📦 Products</a>
<a href="orders.html">🛒 Orders</a>
        <a href="analytics.html">📈 Analytics</a>
        
        <a>⚙ Settings</a>
        <a href="edit-store.html">🏪 My Store</a>
      </div>
    </div>

    <a href="seller-form.html">
      <button class="addBtn" id="addProductBtn">+ Add Product</button>
    </a>
  </div>

  <div id="productsSection"></div>

  <div class="main">

   <div class="topbar" id="dashboardHeader">

  <img id="dashboardBanner" class="banner-bg">

  <div class="header-content">

    <div class="user-info">
      <img id="userPhoto" class="avatar">
      <div>
        <div id="userName"></div>
        <div id="userEmail"></div>
        
      </div>
    </div>

    <button id="loginBtn" class="loginBtn" onclick="googleLogin()">Login</button>
    <button class="deleteBtn" onclick="logout()">Logout</button>

  </div>
<div id="userProfile" class="user-profile">

  <img id="userAvatarClick" class="avatar" onclick="toggleProfileMenu()">

  <div id="profileMenu" class="profile-menu">

    <div onclick="openStore()">🏪 My Store</div>
    <div onclick="goDashboard()">📊 Dashboard</div>
    <div onclick="logout()">🚪 Logout</div>

  </div>

</div>
</div>
    <div class="stats">
      <div class="card">
        <h3>Total Products</h3>
        <div class="num" id="myProducts">0</div>
      </div>
      <div class="card">
        <h3>Total Orders</h3>
        <div class="num" id="myOrders">0</div>
      </div>
      <div class="card">
        <h3>Total Earnings</h3>
        <div class="num" id="myEarnings">Rs 0</div>
      </div>
    </div>

    <div class="chartContainer">
      <h2>Sales Analytics</h2>
      <canvas id="salesChart"></canvas>
    </div>

    <div class="chartContainer">
      <h2>Revenue Analytics</h2>
      <canvas id="salesLineChart"></canvas>
    </div>

    <h2>📦 My Products</h2>
    <div class="products" id="myProductList"></div>

    <div class="chartContainer" style="margin-top: 30px;">
      <h2>💬 Live Messages & Chats</h2>
      <div id="chatSection" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 15px;">
        </div>
    </div>

  </div>

</div>

  </div>
</div>
</div>
  
 
</div>
</body>
</html>
