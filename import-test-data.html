<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeanGelo Test Data Importer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.1);
        }

        button {
            padding: 14px 22px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            white-space: pre-line;
            line-height: 1.7;
        }

        .warning {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>LeanGelo Test Data Importer</h1>

    <div class="warning">
        ⚠️ This will create <b>30 stores</b> and
        <b>5,000 products</b> in Firestore.
    </div>

    <button id="importBtn">
        Import Test Data
    </button>

    <div id="status"></div>

</div>

<script type="module" src="import-test-data.js"></script>

</body>
</html>
