
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Cart | LeanGelo</title>


<style>

/* ==========================================
   LEANGELO — GOLD + BLACK CART THEME
========================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #191919 0%,
            #0b0b0b 45%,
            #050505 100%
        );

    color: #fff;

    min-height: 100vh;
}


/* ==========================================
   HEADER
========================================== */

.header {

    padding: 20px 30px;

    border-bottom:
        1px solid rgba(212, 175, 55, 0.25);

    display: flex;

    justify-content: space-between;

    align-items: center;

    background:
        rgba(0, 0, 0, 0.78);

    backdrop-filter: blur(12px);

    box-shadow:
        0 4px 25px rgba(0, 0, 0, 0.55);
}


.header h1 {

    font-size: 28px;

    color: #d4af37;

    letter-spacing: .5px;

    text-shadow:
        0 0 12px rgba(212, 175, 55, .25);
}


/* ==========================================
   BACK BUTTON
========================================== */

.back-btn {

    padding: 10px 18px;

    border:
        1px solid rgba(212, 175, 55, .5);

    border-radius: 8px;

    background: #111;

    color: #d4af37;

    cursor: pointer;

    transition: all .25s ease;
}


.back-btn:hover {

    background: #d4af37;

    color: #000;

    box-shadow:
        0 0 18px rgba(212, 175, 55, .35);

    transform:
        translateY(-2px);
}


/* ==========================================
   MAIN CONTAINER
========================================== */

.container {

    max-width: 1100px;

    margin: 30px auto;

    padding: 20px;
}


/* ==========================================
   CART LAYOUT
========================================== */

.cart-layout {

    display: grid;

    grid-template-columns:
        1fr 330px;

    gap: 25px;
}


/* ==========================================
   CART ITEMS
========================================== */

.cart-items {

    display: flex;

    flex-direction: column;

    gap: 15px;
}


/* ==========================================
   CART ITEM
========================================== */

.cart-item {

    display: flex;

    gap: 18px;

    padding: 15px;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(212,175,55,.22);

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}


.cart-item:hover {

    transform:
        translateY(-4px);

    border-color:
        rgba(212,175,55,.65);

    box-shadow:
        0 15px 40px rgba(0,0,0,.65),
        0 0 25px rgba(212,175,55,.12);
}


/* ==========================================
   PRODUCT IMAGE
========================================== */

.cart-item img {

    width: 130px;

    height: 100px;

    object-fit: cover;

    border-radius: 10px;

    border:
        1px solid rgba(212,175,55,.2);

    transition:
        transform .35s ease;
}


.cart-item:hover img {

    transform:
        scale(1.04);
}


/* ==========================================
   ITEM INFO
========================================== */

.item-info {

    flex: 1;
}


.item-info h2 {

    font-size: 19px;

    margin-bottom: 8px;

    color: #fff;
}


/* ==========================================
   PRICE
========================================== */

.item-price {

    color: #d4af37;

    font-weight: bold;

    font-size: 18px;

    margin-bottom: 12px;

    text-shadow:
        0 0 8px rgba(212,175,55,.2);
}


/* ==========================================
   QUANTITY
========================================== */

.quantity {

    display: flex;

    align-items: center;

    gap: 10px;
}


.quantity button {

    width: 32px;

    height: 32px;

    border:
        1px solid rgba(212,175,55,.4);

    border-radius: 7px;

    background: #151515;

    color: #d4af37;

    cursor: pointer;

    font-size: 18px;

    transition: all .2s ease;
}


.quantity button:hover {

    background: #d4af37;

    color: #000;

    box-shadow:
        0 0 12px rgba(212,175,55,.3);
}


.quantity span {

    min-width: 25px;

    text-align: center;

    color: #fff;

    font-weight: bold;
}


/* ==========================================
   REMOVE BUTTON
========================================== */

.remove-btn {

    margin-top: 12px;

    padding: 7px 12px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 7px;

    background: #151515;

    color: #aaa;

    cursor: pointer;

    transition: all .25s ease;
}


.remove-btn:hover {

    background: #222;

    color: #d4af37;

    border-color:
        rgba(212,175,55,.45);

    transform:
        translateY(-2px);
}


/* ==========================================
   SUMMARY
========================================== */

.summary {

    height: max-content;

    padding: 22px;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(212,175,55,.3);

    position: sticky;

    top: 20px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.5);

    backdrop-filter: blur(10px);
}


.summary h2 {

    margin-bottom: 20px;

    color: #d4af37;

    font-size: 22px;

    text-shadow:
        0 0 10px rgba(212,175,55,.2);
}


/* ==========================================
   SUMMARY ROW
========================================== */

.summary-row {

    display: flex;

    justify-content: space-between;

    margin: 12px 0;

    color: #ccc;
}


.summary-row span:last-child {

    color: #fff;
}


/* ==========================================
   TOTAL
========================================== */

.total {

    border-top:
        1px solid rgba(212,175,55,.25);

    padding-top: 15px;

    margin-top: 15px;

    font-size: 20px;

    font-weight: bold;
}


.total span:last-child {

    color: #d4af37;

    text-shadow:
        0 0 10px rgba(212,175,55,.25);
}


/* ==========================================
   CHECKOUT BUTTON
========================================== */

.checkout-btn {

    width: 100%;

    padding: 13px;

    margin-top: 20px;

    border:
        1px solid #d4af37;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #b8860b
        );

    color: #000;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: all .25s ease;
}


.checkout-btn:hover {

    background:
        linear-gradient(
            135deg,
            #f1d36a,
            #d4af37
        );

    box-shadow:
        0 0 20px rgba(212,175,55,.4);

    transform:
        translateY(-2px);
}


/* ==========================================
   CONTINUE SHOPPING
========================================== */

.continue-btn {

    width: 100%;

    padding: 11px;

    margin-top: 10px;

    border:
        1px solid rgba(212,175,55,.3);

    border-radius: 8px;

    background: #111;

    color: #d4af37;

    cursor: pointer;

    transition: all .25s ease;
}


.continue-btn:hover {

    background: #d4af37;

    color: #000;

    box-shadow:
        0 0 15px rgba(212,175,55,.3);
}


/* ==========================================
   EMPTY CART
========================================== */

.empty {

    text-align: center;

    padding: 90px 20px;
}


.empty-icon {

    font-size: 65px;

    margin-bottom: 20px;

    filter:
        drop-shadow(
            0 0 12px rgba(212,175,55,.3)
        );
}


.empty h2 {

    margin-bottom: 10px;

    color: #d4af37;

    font-size: 26px;
}


.empty p {

    color: #999;

    margin-bottom: 20px;
}


/* ==========================================
   SHOP BUTTON
========================================== */

.shop-btn {

    padding: 12px 25px;

    border:
        1px solid #d4af37;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #b8860b
        );

    color: #000;

    font-weight: bold;

    cursor: pointer;

    transition: all .25s ease;
}


.shop-btn:hover {

    background:
        linear-gradient(
            135deg,
            #f1d36a,
            #d4af37
        );

    box-shadow:
        0 0 20px rgba(212,175,55,.4);

    transform:
        translateY(-2px);
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:750px) {

    .header {

        padding: 16px;
    }


    .header h1 {

        font-size: 21px;
    }


    .back-btn {

        padding: 8px 12px;

        font-size: 13px;
    }


    .container {

        padding: 14px;
    }


    .cart-layout {

        grid-template-columns: 1fr;
    }


    .summary {

        position: static;
    }


    .cart-item {

        flex-direction: column;
    }


    .cart-item img {

        width: 100%;

        height: 200px;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>🛒 My Cart</h1>

    <button
        class="back-btn"
        onclick="window.location.href='dashboard.html'"
    >
        ← Dashboard
    </button>

</header>


<main class="container">


    <div
        id="emptyCart"
        class="empty"
        style="display:none;"
    >

        <div class="empty-icon">
            🛒
        </div>

        <h2>
            Your Cart is Empty
        </h2>

        <p>
            Add some artworks to your cart.
        </p>

        <button
            class="shop-btn"
            onclick="window.location.href='landing.html'"
        >
            Continue Shopping
        </button>

    </div>


    <div
        id="cartLayout"
        class="cart-layout"
    >


        <div
            id="cartItems"
            class="cart-items"
        ></div>


        <aside class="summary">

            <h2>
                Order Summary
            </h2>


            <div class="summary-row">

                <span>
                    Items
                </span>

                <span id="itemCount">
                    0
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span>
                    Rs <span id="subtotal">0</span>
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <span>
                    Free
                </span>

            </div>


            <div class="summary-row total">

                <span>
                    Total
                </span>

                <span>
                    Rs <span id="total">0</span>
                </span>

            </div>


            <button
                class="checkout-btn"
                onclick="goCheckout()"
            >
                💳 Proceed to Checkout
            </button>


            <button
                class="continue-btn"
                onclick="window.location.href='landing.html'"
            >
                🛍️ Continue Shopping
            </button>

        </aside>


    </div>

</main>


<script
    type="module"
    src="cart.js"
></script>


<script src="toast.js"></script>
</body>

</html>
