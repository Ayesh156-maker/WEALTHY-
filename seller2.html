<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Profile | LeanGelo</title>

<link rel="stylesheet" href="seller2.css">
<script type="module" src="seller2.js"></script>

</head>

<body>

<!-- ===========================
STORE BANNER
=========================== -->

<div class="store-banner">

    <img id="storeBanner"
    src="https://via.placeholder.com/1400x350">

</div>

<!-- ===========================
SELLER HEADER
=========================== -->

<div class="seller-header">

    <img id="sellerLogo"
    class="seller-logo"
    src="https://via.placeholder.com/200">

    <div class="seller-info">

        <h1 id="sellerName">
            Loading...
        </h1>

        <div class="verified">
            ✔ Verified Artist
        </div>

    </div>

</div>

<!-- ===========================
ABOUT ARTIST
=========================== -->

<section class="artist-details">

<h2>About Artist</h2>

<p id="artistStory">

Loading artist story...

</p>

<div class="detail-grid">

<div class="detail-card">

<div class="icon">🎨</div>

<h3>Category</h3>

<span id="artStyle">-</span>

</div>

<div class="detail-card">

<div class="icon">⌛</div>

<h3>Experience</h3>

<span id="experience">-</span>

</div>

<div class="detail-card">

<div class="icon">🌍</div>

<h3>Location</h3>

<span id="location">-</span>

</div>

</div>

</section>

<!-- ===========================
SOCIAL LINKS
=========================== -->

<section class="social-section">

<h2>Follow Artist</h2>

<div class="social-links">

<a id="website"
target="_blank">

🌐 Website

</a>

<a id="instagram"
target="_blank">

📸 Instagram

</a>

<a id="facebook"
target="_blank">

📘 Facebook

</a>

</div>

</section>

<!-- ===========================
ACHIEVEMENTS
=========================== -->

<section class="achievements">

<h2>Achievements</h2>

<div class="badges">

<span class="badge">
✔ Verified Artist
</span>

<span class="badge">
🏆 Top Seller
</span>

<span class="badge">
🎨 Creative Artist
</span>

<span class="badge">
⭐ Premium Member
</span>

</div>

</section>

<!-- ===========================
FOLLOWERS
=========================== -->

<section class="stats">

<div class="stat-card">

<h2 id="followers">

0

</h2>

<p>Followers</p>

</div>

</section>

<!-- ===========================
PRODUCTS
=========================== -->

<section class="products-section">

<h2 class="section-title">

Products

</h2>

<!--
JavaScript එකෙන් Category
අනුව මෙතන create වෙනවා.

Painting
Digital Art
Photography
Luxury
...

-->

<div id="categoryProducts">

Loading Products...

</div>

</section>

<script src="toast.js"></script>
</body>

</html>
